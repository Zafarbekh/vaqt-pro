en:{Fajr:'Fajr',Sunrise:'Sunrise',Dhuhr:'Dhuhr',Asr:'Asr',Maghrib:'Maghrib',Isha:'Isha',home:'Home',times:'Prayers',set:'Settings',qibla:'Qibla',cal:'Calendar',tas:'Tasbih',qazo:'Qaza',wake:'Alarm',task:'Tasks',tool:'Tools',more:'More'}};

(function(){const ok=x=>x==='sys'||String(x).startsWith('u_');Object.values(S.pm||{}).forEach(p=>{if(!ok(p.s))p.s='sys'});(S.alarms||[]).forEach(a=>{if(!ok(a.snd))a.snd='sys'});delete S.ram})();

function times(date,lat,lng,tz){const R=Math.PI/180,D=(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(2000,0,1,12))/864e5,g=(357.529+.98560028*D)%360,q=(280.459+.98564736*D)%360,L=q+1.915*Math.sin(g*R)+.02*Math.sin(2*g*R),e=23.439-4e-7*D,ra=((Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15)+24)%24,dec=Math.asin(Math.sin(e*R)*Math.sin(L*R))/R;let eq=q/15-ra;if(eq>12)eq-=24;if(eq<-12)eq+=24;const noon=12+tz-lng/15-eq,A=a=>Math.acos((-Math.sin(a*R)-Math.sin(dec*R)*Math.sin(lat*R))/(Math.cos(dec*R)*Math.cos(lat*R)))/R/15,aA=-Math.atan(1/(2+Math.tan(Math.abs(lat-dec)*R)))/R;return{Fajr:noon-A(15.4),Sunrise:noon-A(.833),Dhuhr:noon,Asr:noon+A(aA),Maghrib:noon+A(.833)+.058,Isha:noon+A(15)+.017}}

function calc(src){const t=src.replace(/\s+/g,'').match(/\d+\.?\d*|\.\d+|[-+*/()]/g)||[];if(t.join('')!==src.replace(/\s+/g,''))throw 0;let i=0;

function boot(){if(!S.lang)return ob1();if(!S.region)return ob2();if(!S.toured)return tour(1);draw()}
function ob1(){const d=ov(`<h1 style="font-weight:400">Vaqt</h1><p class="mu">Til / Язык / Language</p><select id="l"><option value="uz">O'zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select><button class="btn" id="b">→</button>`);$('#b').onclick=()=>{S.lang=$('#l').value;save();d.remove();boot()}}
function ob2(){const d=ov(`<h1 style="font-weight:400">Yashash joyingiz</h1><select id="c">${Object.keys(P).map(c=>`<option>${c}</option>`)}</select><select id="r"></select><select id="d"></select><button class="btn" id="g" style="background:var(--s2)">📍 GPS bilan aniqlash</button><small class="mu">GPS ixtiyoriy: faqat namoz vaqtini hisoblash uchun. Xohlamasangiz, ro'yxatdan tanlang.</small><button class="btn" id="b">Davom etish</button>`);const fd=()=>{const dd=(P[$('#c').value].d||{})[$('#r').value];$('#d').innerHTML=Object.keys(dd||{Markaz:0}).map(x=>`<option>${x}</option>`).join('')},fr=()=>{$('#r').innerHTML=Object.keys(P[$('#c').value].r).map(x=>`<option>${x}</option>`).join('');fd()};$('#c').onchange=fr;$('#r').onchange=fd;fr();const done=ll=>{S.ll=ll;S.country=$('#c').value;S.region=$('#r').value;S.dist=ll?'GPS':$('#d').value;save();d.remove();boot()};$('#g').onclick=()=>navigator.geolocation.getCurrentPosition(p=>done([p.coords.latitude,p.coords.longitude]),()=>toast('GPS yoqilmagan'));$('#b').onclick=()=>done(null)}
function privacy(){const d=ov(`<h2 style="font-weight:600">Maxfiylik</h2><div style="text-align:left;display:grid;gap:10px;max-height:62vh;overflow:auto"><p><b>Hisob yo'q.</b> Ilova ro'yxatdan o'tishni so'ramaydi va ma'lumotlaringizni o'z serverimizga yubormaydi.</p><p><b>Telefoningizda saqlanadi:</b> til, joy, vazifalar, budilnik, qazo va tasbeh hisobi hamda siz yuklagan ovozlar. Ilovani o'chirsangiz, bu ma'lumotlar ham o'chadi.</p><p><b>Joylashuv (GPS):</b> faqat namoz vaqtlari va qiblani hisoblash uchun ishlatiladi. Majburiy emas: joyni ro'yxatdan qo'lda tanlash mumkin.</p><p><b>Ob-havo:</b> ob-havo ko'rsatilganda joyingizning koordinatalari Open-Meteo xizmatiga yuboriladi (ism yoki boshqa shaxsiy ma'lumotsiz).</p><p><b>Kamera:</b> faqat kamerali budilnikni o'chirish uchun; rasm saqlanmaydi va hech kimga yuborilmaydi.</p><p class="mu">Namoz vaqtlari hisoblash yo'li bilan topiladi va rasmiy jadvaldan bir necha daqiqaga farq qilishi mumkin.</p></div><button class="btn" id="b">Yopish</button>`);$('#b').onclick=()=>d.remove()}
function tour(first){const d=ov(`<div style="font-size:64px">🔔</div><h1 style="font-weight:400">Budilnik</h1><p>Telefoningiz ovozsiz holatda bo'lsa ham budilnik chaladi.</p><p class="mu">10 daqiqa oldin past, 5 daqiqa oldin o'rta, vaqtida baland ovozda. Kamera yoqilgan bo'lsa, o'chirish uchun uydagi oddiy narsani rasmga olasiz.</p><button class="btn" id="b">Tushundim</button>`);$('#b').onclick=()=>{S.toured=true;save();d.remove();first&&boot()}}
/* native budilnik (ilova yopiq bo'lsa ham) */
const upl={};
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
async function syncNative(){if(!NATIVE||!S.region)return;try{
for(const[id]of S.mine){if(!upl[id]){const b=await dbGet(id);if(b){await NP.saveSound({id,data:await blobB64(b)});upl[id]=1}}}
const it=[],now=Date.now(),MI=6e4,add=(at,o)=>{if(at>now)it.push(Object.assign({at},o))};
for(let d=0;d<14;d++){const dt=new Date();dt.setDate(dt.getDate()+d);dt.setHours(0,0,0,0);const r=day(dt),b0=dt.getTime();
if(!S.mute)PR.forEach(k=>{const p=PM(k);if(!p.m)return;const at=b0+Math.round(r[k]*36e5);if(p.b)add(at-p.b*MI,{kind:'beep',label:t(k)+': '+p.b+' daqiqa qoldi',vol:.5,maxMs:4000});add(at,{kind:p.m==1?'vib':p.m==2?'beep':'azan',snd:p.s,label:t(k),vol:1,maxMs:0})});
S.alarms.forEach(a=>{const[h,m]=a.time.split(':'),at=b0+(+h*60+ +m)*MI,lb=a.name||a.time;add(at-10*MI,{kind:'azan',snd:a.snd,label:lb,vol:.3,maxMs:9e4});add(at-5*MI,{kind:'azan',snd:a.snd,label:lb,vol:.6,maxMs:9e4});add(at,{kind:'azan',snd:a.snd,label:lb,vol:1,loop:true,ui:true,cam:!!a.cam,time:a.time,maxMs:9e5})})}
S.tasks.forEach(k=>{if(k.d&&k.m=='a'&&!k.items.every(x=>x.d))add(new Date(k.d).getTime(),{kind:'beep',label:k.n,vol:.8,maxMs:5000})});
await NP.schedule({items:it})}catch(e){}}
function initNative(){if(!NATIVE)return;NP.addListener('ring',e=>ringing({time:e.time,name:e.name,cam:e.cam}));const chk=async()=>{try{const r=await NP.pending();if(r&&r.time)ringing({time:r.time,name:r.name,cam:r.cam})}catch(e){}};chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});syncNative()}
/* eslatma / budilnik tekshiruvi */
const fired={};
function tick(){if(NATIVE)return setTimeout(tick,60000);if(!S.region)return setTimeout(tick,2000);const n=new Date(),now=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,key=n.toDateString(),r=day(n);
if(!S.mute)PR.forEach(k=>{const p=PM(k);if(!p.m)return;const at=r[k]*60;[[p.b,1],[0,0]].forEach(([b,pre])=>{if(pre&&!b)return;const f=key+k+b;if(!fired[f]&&now>=at-b&&now<at-b+1){fired[f]=1;if(pre){beep();toast(t(k)+': '+b+' daqiqa qoldi');return}if(p.m==1)navigator.vibrate&&navigator.vibrate([400,200,400]);else if(p.m==2)beep();else play(p.s,1);toast('🕌 '+t(k))}})});
S.alarms.forEach((a,i)=>{const[h,m]=a.time.split(':'),at=+h*60+ +m;[[10,.25],[5,.6],[0,1]].forEach(([b,v])=>{const f=key+'a'+i+b;if(!fired[f]&&now>=at-b&&now<at-b+1){fired[f]=1;b?(play(a.snd,v),toast('⏰ '+(a.name||a.time)+' · '+b+' daq')):ringing(a)}})});
S.tasks.forEach(k=>{if(k.d&&!fired[k.d+k.n]&&!k.items.every(x=>x.d)&&new Date(k.d)<=n){fired[k.d+k.n]=1;toast('✅ '+k.n);k.m=='a'?beep():0}});
setTimeout(tick,S.saver?15000:1000)}
tick();boot();initNative();
</script></body></html>
